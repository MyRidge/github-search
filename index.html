<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub 搜索</title>
<style>
  :root {
    --blue: #4e6ef2;
    --blue-dark: #3a58d8;
    --text: #222;
    --text-sub: #666;
    --text-light: #9195a3;
    --line: #ebebeb;
    --bg: #fff;
    --bg-hover: #f5f7ff;
    --star: #e3b341;
    --green: #2da44e;
    --violet: #8250df;
    --orange: #bc4c00;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.5;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  /* ---------- 首页 ---------- */
  #home {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 24px 120px;
    animation: fade .35s ease;
  }
  #home .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 34px;
    font-size: 44px;
    font-weight: 600;
    letter-spacing: -.5px;
  }
  #home .brand svg { width: 52px; height: 52px; }
  #home .brand .hl { color: var(--blue); }
  .searchbar {
    width: 100%;
    max-width: 654px;
    height: 46px;
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1.5px solid #d9d9d9;
    border-radius: 12px;
    padding: 0 6px 0 16px;
    transition: border-color .18s, box-shadow .18s;
  }
  .searchbar:focus-within {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(78,110,242,.12);
  }
  .searchbar input {
    flex: 1;
    border: 0;
    outline: 0;
    font-size: 16px;
    background: transparent;
    color: var(--text);
    height: 100%;
  }
  .searchbar input::placeholder { color: #b4b4b4; }
  .searchbar .go {
    border: 0;
    background: var(--blue);
    color: #fff;
    height: 34px;
    min-width: 62px;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    transition: background .18s;
  }
  .searchbar .go:hover { background: var(--blue-dark); }

  .home-extra {
    width: 100%;
    max-width: 654px;
    margin-top: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    color: var(--text-light);
    font-size: 13px;
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .home-tools { display: flex; align-items: center; gap: 10px; }
  .trans-status { color: var(--text-light); font-size: 12px; }
  .chip {
    padding: 4px 12px;
    border-radius: 999px;
    background: #f4f5f7;
    color: var(--text-sub);
    cursor: pointer;
    border: 0;
    font-size: 13px;
    transition: background .15s, color .15s;
  }
  .chip:hover { background: #eaeaf3; color: var(--blue); }

  /* ---------- 结果页顶栏 ---------- */
  #header {
    display: none;
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px 24px 10px;
  }
  #header .bar {
    display: flex;
    align-items: center;
    gap: 18px;
    max-width: 1000px;
  }
  #header .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 22px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    letter-spacing: -.3px;
  }
  #header .logo svg { width: 26px; height: 26px; }
  #header .logo .hl { color: var(--blue); }
  #header .searchbar { max-width: 620px; height: 40px; border-radius: 10px; }
  #header .searchbar input { font-size: 15px; }
  #header .searchbar .go { height: 30px; min-width: 54px; font-size: 14px; }

  .filters {
    max-width: 1000px;
    display: flex;
    gap: 22px;
    align-items: center;
    margin-top: 8px;
    padding-left: 205px;
    font-size: 13px;
    color: var(--text-light);
    flex-wrap: wrap;
  }
  .filters .tabs { display: flex; gap: 18px; }
  .filters .tab {
    cursor: pointer;
    padding: 4px 0;
    border-bottom: 2px solid transparent;
    color: var(--text-sub);
    background: none;
    border: 0;
    font-size: 13px;
  }
  .filters .tab.on { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
  .filters select {
    margin-left: auto;
    font-size: 13px;
    padding: 3px 6px;
    border: 1px solid #ddd;
    border-radius: 6px;
    background: #fff;
    color: var(--text-sub);
    outline: none;
  }
  .filters .sortwrap { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .filters .sortwrap span { color: var(--text-light); }

  /* ---------- 结果 ---------- */
  #results {
    max-width: 1000px;
    padding: 18px 24px 60px;
    display: none;
  }
  .meta {
    color: var(--text-light);
    font-size: 13px;
    margin-bottom: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .meta b { color: var(--text-sub); font-weight: 500; }
  .meta .dot { color: #d0d0d0; }

  .card {
    padding: 16px 18px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    transition: background .15s, border-color .15s;
    margin-bottom: 2px;
  }
  .card:hover { background: #fafbff; border-color: #eef0ff; }
  .card .full {
    font-size: 18px;
    font-weight: 500;
    color: #1a0dab;
    display: inline-block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: bottom;
  }
  .card .full .owner { color: #5f6368; font-weight: 400; }
  .card:hover .full { text-decoration: underline; }
  .card .sub {
    color: var(--green);
    font-size: 13px;
    margin: 2px 0 6px;
  }
  .card .desc {
    color: var(--text-sub);
    font-size: 14px;
    margin-bottom: 8px;
    word-break: break-word;
  }
  .card .desc.empty { color: #b4b4b4; font-style: italic; }

  .readme {
    margin: 8px 0 10px;
    padding: 10px 12px;
    border-left: 3px solid #e8eaf6;
    background: #fafafd;
    border-radius: 0 8px 8px 0;
    color: #555;
    font-size: 13px;
    line-height: 1.65;
    display: none;
    position: relative;
  }
  .readme.show { display: block; }
  .readme:not(.open) { cursor: pointer; }
  .readme .rd-body {
    word-break: break-word;
    line-height: 1.65;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .readme.open .rd-body {
    display: block;
    -webkit-line-clamp: unset;
  }
  .readme .rd-label {
    display: inline-block;
    font-size: 11px;
    line-height: 1.4;
    color: var(--blue);
    background: #eef0fb;
    border-radius: 4px;
    padding: 0 6px;
    margin-bottom: 5px;
    letter-spacing: .3px;
  }
  .readme .rd-err { color: #b04a4a; }
  .readme .more {
    display: none;
  }

  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag {
    font-size: 12px;
    color: #57606a;
    background: #eef1f5;
    border-radius: 999px;
    padding: 1px 9px;
    transition: background .15s, color .15s;
  }
  .tag:hover { background: #dde6ff; color: var(--blue); }

  /* 最新 Release */
  .release {
    display: none;
    margin: 0 0 10px;
    padding: 8px 12px;
    border: 1px solid #e8ecf5;
    border-radius: 8px;
    background: #fcfdff;
    font-size: 13px;
  }
  .release.show { display: block; }
  .release .rel-head {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 3px;
  }
  .release .rel-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-weight: 600;
    color: var(--blue);
    font-size: 13px;
    word-break: break-all;
  }
  .release .rel-tag svg { width: 13px; height: 13px; flex-shrink: 0; }
  .release .rel-date { color: var(--text-light); font-size: 12px; }
  .release .rel-badge {
    font-size: 11px;
    border-radius: 4px;
    padding: 0 5px;
    line-height: 16px;
    background: #e8f5ec;
    color: var(--green);
  }
  .release .rel-badge.pre {
    background: #fff4e5;
    color: var(--orange);
  }
  .release .rel-body {
    color: var(--text-sub);
    line-height: 1.6;
    word-break: break-word;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .release.open .rel-body {
    display: block;
    -webkit-line-clamp: unset;
  }
  .release:not(.open) { cursor: pointer; }
  .release .rel-empty { color: var(--text-light); font-size: 12px; }

  /* 中英切换：默认显示中文，点「原文」切回英文 */
  .bi-en { display: none; }
  .show-en .bi-zh { display: none; }
  .show-en .bi-en {
    display: inline;
    color: var(--text-sub);
    font-size: .95em;
    opacity: .85;
  }
  .lang-toggle {
    display: inline-block;
    margin-top: 4px;
    padding: 0;
    font-size: 12px;
    color: var(--blue);
    background: none;
    border: none;
    cursor: pointer;
    opacity: .75;
  }
  .lang-toggle:hover { opacity: 1; text-decoration: underline; }
  .translating .rd-label::after,
  .translating .rel-tag::after {
    content: ' 翻译中…';
    font-weight: 400;
    color: var(--text-light);
    font-size: 12px;
  }

  .stats {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    color: var(--text-light);
    font-size: 13px;
    align-items: center;
  }
  .stats .item { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .stats .item svg { width: 14px; height: 14px; }
  .stats .st-star svg { color: var(--star); }
  .stats .st-issue svg { color: var(--orange); }
  .stats .st-fork svg { color: var(--text-light); }
  .dot-lang {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: -1px;
  }

  .skeleton { padding: 20px 18px; }
  .sk-line {
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, #f0f0f0 25%, #f7f7f7 37%, #f0f0f0 63%);
    background-size: 400% 100%;
    animation: shine 1.3s ease-in-out infinite;
    margin-bottom: 10px;
  }
  @keyframes shine { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  .pager {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin: 26px 0 0;
    flex-wrap: wrap;
  }
  .pager button {
    min-width: 34px;
    height: 34px;
    border: 1px solid #e4e4e4;
    background: #fff;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text-sub);
    font-size: 13px;
    transition: all .15s;
  }
  .pager button:hover:not(:disabled):not(.on) { border-color: var(--blue); color: var(--blue); }
  .pager button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .pager button:disabled { opacity: .4; cursor: default; }
  .pager .gap { color: var(--text-light); padding: 0 2px; }

  /* ---------- 空 / 错误 ---------- */
  .notice {
    max-width: 1000px;
    padding: 40px 24px;
    display: none;
  }
  .notice .title { font-size: 17px; margin-bottom: 8px; }
  .notice .body { color: var(--text-sub); font-size: 14px; line-height: 1.8; }
  .notice .body code {
    background: #f2f3f5;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .notice .acts { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; }
  .notice .acts button {
    border: 1px solid #dfe1e5;
    background: #fff;
    border-radius: 8px;
    padding: 7px 16px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-sub);
  }
  .notice .acts button:hover { border-color: var(--blue); color: var(--blue); }

  /* ---------- 设置面板 ---------- */
  .sheet-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.28);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 60;
    padding: 20px;
  }
  .sheet-mask.open { display: flex; }
  .sheet {
    background: #fff;
    border-radius: 14px;
    width: 100%;
    max-width: 440px;
    padding: 22px 24px 20px;
    box-shadow: 0 18px 50px rgba(0,0,0,.18);
    animation: pop .2s ease;
  }
  @keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet h3 { margin: 0 0 6px; font-size: 17px; }
  .sheet p { margin: 0 0 14px; color: var(--text-sub); font-size: 13px; line-height: 1.7; }
  .sheet p a { color: var(--blue); }
  .sheet input {
    width: 100%;
    height: 38px;
    border: 1px solid #dcdcdc;
    border-radius: 8px;
    padding: 0 12px;
    font-size: 14px;
    outline: none;
    font-family: ui-monospace, Menlo, monospace;
  }
  .sheet input:focus { border-color: var(--blue); }
  .sheet .row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  .sheet .row button {
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid #dfe1e5;
    background: #fff;
    color: var(--text-sub);
  }
  .sheet .row button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .sheet .row button.primary:hover { background: var(--blue-dark); }
  .sheet .hint { font-size: 12px; color: var(--text-light); margin-top: 10px; }

  .gh-link { position: fixed; right: 18px; bottom: 16px; font-size: 12px; color: var(--text-light); z-index: 40; }
  .gh-link:hover { color: var(--blue); }
  .gh-link svg { width: 14px; height: 14px; vertical-align: -2px; }

  @media (max-width: 860px) {
    .filters { padding-left: 0; }
    #home .brand { font-size: 32px; }
    #home .brand svg { width: 38px; height: 38px; }
    #header .logo span { display: none; }
    #header .bar { gap: 12px; }
  }
</style>
</head>
<body>

<!-- 首页 -->
<div id="home">
  <div class="brand">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
    <span>GitHub <span class="hl">搜索</span></span>
  </div>
  <form class="searchbar" id="homeForm" autocomplete="off">
    <input id="homeInput" type="text" placeholder="搜索 GitHub 开源项目，如 react、爬虫、vscode 插件…" spellcheck="false">
    <button class="go" type="submit">搜索</button>
  </form>
  <div class="home-extra">
    <div class="chips" id="chips">
      <button class="chip" data-q="stars:>50000">最热门项目</button>
      <button class="chip" data-q="language:Python stars:>10000">Python 神器</button>
      <button class="chip" data-q="topic:llm stars:>1000">LLM 相关</button>
      <button class="chip" data-q="language:TypeScript stars:>5000">前端轮子</button>
    </div>
    <div class="home-tools">
      <button class="chip" id="openSettings" title="配置 GitHub Token 以提升限额">⚙ 设置</button>
      <span class="trans-status" id="transStatus"></span>
    </div>
  </div>
</div>

<!-- 结果页顶栏 -->
<div id="header">
  <div class="bar">
    <div class="logo" id="toHome">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      <span>GitHub <span class="hl">搜索</span></span>
    </div>
    <form class="searchbar" id="topForm" autocomplete="off">
      <input id="topInput" type="text" spellcheck="false">
      <button class="go" type="submit">搜索</button>
    </form>
  </div>
  <div class="filters">
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="repos">仓库</button>
      <button class="tab" data-tab="users">用户</button>
    </div>
    <div class="sortwrap" id="sortWrap">
      <span>排序</span>
      <select id="sortSel">
        <option value="">最佳匹配</option>
        <option value="stars">星数最多</option>
        <option value="forks">Fork 最多</option>
        <option value="updated">最近更新</option>
      </select>
    </div>
    <button class="chip" id="openSettings2" title="配置 GitHub Token">⚙</button>
  </div>
</div>

<!-- 结果 -->
<div id="results"></div>
<div class="notice" id="notice"></div>

<a class="gh-link" href="https://github.com" target="_blank" rel="noopener">
  <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
  Powered by GitHub API
</a>

<!-- 设置面板 -->
<div class="sheet-mask" id="sheetMask">
  <div class="sheet" role="dialog" aria-modal="true">
    <h3>GitHub Token（可选）</h3>
    <p>
      未配置时走 GitHub 匿名接口，每个 IP 每分钟最多约 10 次搜索，容易触发限流。
      填入一个只勾 <b>public_repo</b> 或完全不带权限的 Personal Access Token，
      可提升到每分钟 30 次并避免被临时封禁。Token 只保存在你自己的浏览器 localStorage 里。
      <br><a href="https://github.com/settings/tokens" target="_blank" rel="noopener">去创建 Token →</a>
    </p>
    <input id="tokenInput" type="password" placeholder="ghp_xxx / github_pat_xxx" autocomplete="off">
    <div class="hint" id="rateHint"></div>
    <div class="row">
      <button id="clearToken">清除</button>
      <button class="primary" id="saveToken">保存</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ======================= 常量和状态 =======================
  const API = 'https://api.github.com';
  const PER_PAGE = 10;
  const TOKEN_KEY = 'gh_search_token';
  const PER_PAGE_MAX = 100; // GitHub 搜索接口 page * per_page 上限 1000

  const state = {
    q: '',
    tab: 'repos',   // repos | users
    sort: '',
    page: 1,
    total: 0,
    loading: false,
    readmeCache: new Map(),   // full_name -> text | {error}
    releaseCache: new Map(),  // full_name -> 最新 release 信息
    searchCache: new Map(),   // 搜索/用户结果的内存缓存，回退页面时秒开
    renderSeq: 0,
  };

  const $ = (id) => document.getElementById(id);
  const els = {
    home: $('home'),
    header: $('header'),
    results: $('results'),
    notice: $('notice'),
    homeInput: $('homeInput'),
    topInput: $('topInput'),
    sortSel: $('sortSel'),
    tabs: $('tabs'),
    sortWrap: $('sortWrap'),
  };

  // ======================= 工具函数 =======================
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  function fmtNum(n) {
    n = Number(n) || 0;
    if (n >= 100000) return (n / 1000).toFixed(0) + 'k';
    if (n >= 10000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return String(n);
  }

  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const diff = Date.now() - d.getTime();
    const day = 86400000;
    if (diff < 3600000) return Math.max(1, Math.floor(diff / 60000)) + ' 分钟前';
    if (diff < day) return Math.floor(diff / 3600000) + ' 小时前';
    if (diff < 30 * day) return Math.floor(diff / day) + ' 天前';
    if (diff < 365 * day) return Math.floor(diff / (30 * day)) + ' 个月前';
    return Math.floor(diff / (365 * day)) + ' 年前';
  }

  function fmtDateFull(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  // 语言配色（常用语言的近似 GitHub 官方色）
  const LANG_COLORS = {
    JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#3572A5', Java: '#b07219',
    Go: '#00ADD8', Rust: '#dea584', 'C++': '#f34b7d', C: '#555555', 'C#': '#178600',
    Ruby: '#701516', PHP: '#4F5D95', Swift: '#F05138', Kotlin: '#A97BFF', Dart: '#00B4AB',
    Shell: '#89e051', HTML: '#e34c26', CSS: '#563d7c', SCSS: '#c6538c', Vue: '#41b883',
    Jupyter: '#DA5B0B', 'Jupyter Notebook': '#DA5B0B', 'Objective-C': '#438eff',
    Scala: '#c22d40', Elixir: '#6e4a7e', Haskell: '#5e5086', Lua: '#000080',
    Perl: '#0298c3', R: '#198CE7', Zig: '#ec915c', SwiftUI: '#F05138', Makefile: '#427819',
    Dockerfile: '#384d54', Nix: '#7e7eff', Clojure: '#db5855', 'F#': '#b845fc',
  };
  const langColor = (l) => LANG_COLORS[l] || '#8b949e';

  // ======================= API 封装 =======================
  const getToken = () => localStorage.getItem(TOKEN_KEY) || '';

  function authHeaders() {
    const h = { 'Accept': 'application/vnd.github+json' };
    const t = getToken();
    if (t) h['Authorization'] = 'Bearer ' + t;
    return h;
  }

  class ApiError extends Error {
    constructor(message, status, kind) {
      super(message);
      this.status = status;
      this.kind = kind; // rate | auth | network | notfound | other
    }
  }

  async function apiGet(path) {
    let res;
    try {
      res = await fetch(API + path, { headers: authHeaders() });
    } catch (e) {
      throw new ApiError('网络请求失败，请检查网络连接或代理设置', 0, 'network');
    }
    if (res.ok) {
      const remain = res.headers.get('x-ratelimit-remaining');
      const reset = res.headers.get('x-ratelimit-reset');
      if (remain != null) {
        sessionStorage.setItem('gh_rate', JSON.stringify({ remain: +remain, reset: +reset, at: Date.now() }));
      }
      return res;
    }
    let msg = '';
    try {
      const j = await res.json();
      msg = j && j.message ? j.message : '';
    } catch (_) {}
    if (res.status === 403 || res.status === 429) {
      if (/rate limit/i.test(msg) || res.headers.get('x-ratelimit-remaining') === '0') {
        throw new ApiError(msg || 'API 速率已达上限', res.status, 'rate');
      }
      throw new ApiError(msg || '请求被 GitHub 拒绝', res.status, 'other');
    }
    if (res.status === 401) throw new ApiError(msg || 'Token 无效或已过期', 401, 'auth');
    if (res.status === 404) throw new ApiError(msg || '接口不存在', 404, 'notfound');
    throw new ApiError(msg || `请求失败（${res.status}）`, res.status, 'other');
  }

  async function searchRepos(q, page, sort) {
    const key = `r|${q}|${page}|${sort}`;
    if (state.searchCache.has(key)) return state.searchCache.get(key);
    let path = `/search/repositories?q=${encodeURIComponent(q)}&per_page=${PER_PAGE}&page=${page}`;
    if (sort) path += `&sort=${sort}&order=desc`;
    const res = await apiGet(path);
    const data = await res.json();
    state.searchCache.set(key, data);
    return data;
  }

  async function searchUsers(q, page) {
    const key = `u|${q}|${page}`;
    if (state.searchCache.has(key)) return state.searchCache.get(key);
    const path = `/search/users?q=${encodeURIComponent(q)}&per_page=${PER_PAGE}&page=${page}`;
    const res = await apiGet(path);
    const data = await res.json();
    state.searchCache.set(key, data);
    return data;
  }

  // 最新 Release：只取 1 条，带内存 + sessionStorage 缓存
  const RELEASE_KEY = 'gh_release_cache_v1';

  function readReleaseStore() {
    try {
      return JSON.parse(sessionStorage.getItem(RELEASE_KEY) || '{}');
    } catch (_) {
      return {};
    }
  }

  function writeReleaseStore(store) {
    try {
      sessionStorage.setItem(RELEASE_KEY, JSON.stringify(store));
    } catch (_) {
      try { sessionStorage.removeItem(RELEASE_KEY); } catch (__) {}
    }
  }

  async function fetchLatestRelease(fullName) {
    if (state.releaseCache.has(fullName)) return state.releaseCache.get(fullName);

    const store = readReleaseStore();
    if (store[fullName]) {
      state.releaseCache.set(fullName, store[fullName]);
      return store[fullName];
    }

    let out;
    try {
      const res = await fetch(`${API}/repos/${fullName}/releases?per_page=1`, { headers: authHeaders() });
      if (res.status === 404) {
        out = { none: true };
      } else if (!res.ok) {
        out = { error: `读取失败（${res.status}）` };
      } else {
        const arr = await res.json();
        if (!Array.isArray(arr) || !arr.length) {
          out = { none: true };
        } else {
          const r = arr[0];
          out = {
            tag: r.tag_name || r.name || '',
            name: r.name || '',
            url: r.html_url,
            published: r.published_at || r.created_at,
            pre: !!r.prerelease,
            draft: !!r.draft,
            body: toReleaseNote(r.body),
            assets: Array.isArray(r.assets) ? r.assets.length : 0,
          };
        }
      }
    } catch (e) {
      state.releaseCache.set(fullName, { error: '读取失败' });
      return { error: '读取失败' };
    }
    state.releaseCache.set(fullName, out);
    const next = readReleaseStore();
    next[fullName] = out;
    writeReleaseStore(next);
    return out;
  }

  // Release 说明（markdown）压成可读的一两行
  function toReleaseNote(raw) {
    let text = String(raw || '');
    text = text.replace(/```[\s\S]*?```/g, ' ').replace(/<!--[\s\S]*?-->/g, ' ');
    text = text.replace(/<[^>]+>/g, ' ');
    text = text.replace(/!\[[^\]]*\]\([^)]*\)/g, ' ');
    text = text.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
    text = text.replace(/^\s{0,3}#{1,6}\s*/gm, '').replace(/^\s*[-*+]\s+/gm, '· ');
    text = text.replace(/^\s*(Full Changelog|What's Changed|Contributors)\b.*$/gim, ' ');
    text = text.replace(/[*_`~>|#]/g, '');
    text = text.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2B00}-\u{2BFF}]/gu, '');
    text = text.replace(/\s+/g, ' ').trim();
    return text.slice(0, 220);
  }

  // README 摘要：内存 + sessionStorage 双层缓存，翻页、重搜、刷新都不再重复请求
  const README_KEY = 'gh_readme_cache_v1';

  function readReadmeStore() {
    try {
      return JSON.parse(sessionStorage.getItem(README_KEY) || '{}');
    } catch (_) {
      return {};
    }
  }

  function writeReadmeStore(store) {
    try {
      sessionStorage.setItem(README_KEY, JSON.stringify(store));
    } catch (_) {
      // 超出配额时丢弃旧缓存，只保留本次会话的内存缓存
      try { sessionStorage.removeItem(README_KEY); } catch (__) {}
    }
  }

  async function fetchReadme(fullName) {
    if (state.readmeCache.has(fullName)) return state.readmeCache.get(fullName);

    const store = readReadmeStore();
    if (store[fullName]) {
      state.readmeCache.set(fullName, store[fullName]);
      return store[fullName];
    }

    let out;
    try {
      const res = await fetch(`${API}/repos/${fullName}/readme`, {
        headers: { ...authHeaders(), 'Accept': 'application/vnd.github.raw+json' },
      });
      if (!res.ok) {
        out = { error: res.status === 404 ? '' : `读取失败（${res.status}）` };
      } else {
        out = { text: toSnippet(await res.text()) };
      }
    } catch (e) {
      out = { error: '读取失败' };
      // 网络错误不入持久缓存，下次仍可重试
      state.readmeCache.set(fullName, out);
      return out;
    }
    state.readmeCache.set(fullName, out);
    const next = readReadmeStore();
    next[fullName] = out;
    writeReadmeStore(next);
    return out;
  }

  // 把 README 原文压成一句可读摘要
  function toSnippet(raw) {
    let text = String(raw || '');

    // 去掉 markdown 代码块
    text = text.replace(/```[\s\S]*?```/g, ' ');
    // 去掉 HTML 注释与标签
    text = text.replace(/<!--[\s\S]*?-->/g, ' ');
    text = text.replace(/<[^>]+>/g, ' ');
    // 去掉图片（含徽章）、链接只留文字
    text = text.replace(/!\[[^\]]*\]\([^)]*\)/g, ' ');
    text = text.replace(/\[([^\]]*)\]\([^)]*\)/g, '$1');
    // 去掉分隔线与标题符号
    text = text.replace(/^\s*[-=*_]{3,}\s*$/gm, ' ').replace(/^\s{0,3}#{1,6}\s*/gm, '');
    // 去掉表格分隔行
    text = text.replace(/^\s*\|?[\s:|-]{5,}\|?\s*$/gm, ' ');
    // 去掉整行徽章/纯符号行、居中标签行
    text = text.replace(/^\s*[<>/|a-zA-Z="'.\- ]*badge[^\n]*$/gim, ' ');
    // 解掉常见 HTML 实体
    text = text.replace(/&(middot|nbsp|amp|lt|gt|quot|hellip|mdash|ndash|copy|bull|#\d+);/g, (m, name) => {
      const map = { middot: ' · ', nbsp: ' ', amp: '&', lt: '<', gt: '>', quot: '"', hellip: '…', mdash: '—', ndash: '–', copy: '©', bull: '•' };
      if (name[0] === '#') return String.fromCharCode(+name.slice(1));
      return map[name] || ' ';
    });
    // 去掉 emoji 短码和多余空白
    text = text.replace(/:[a-z0-9_+-]+:/gi, ' ');
    text = text.replace(/[*_`~]/g, '');
    // 去掉 emoji 与常见符号字符，避免摘要里出现零星图标
    text = text.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{2B00}-\u{2BFF}]/gu, '');
    text = text.replace(/[|]/g, ' ');
    text = text.replace(/[ \t]+/g, ' ');
    text = text.replace(/\n{2,}/g, '\n').trim();

    // 取前几行有意义的文字
    const lines = text.split('\n').map((l) => l.trim()).filter((l) => l && l.length > 2);
    // 跳过首行若它只是仓库名之类的短标题
    let merged = lines.join(' ');
    merged = merged.replace(/\s+/g, ' ').trim();
    return merged.slice(0, 300);
  }

  // ======================= 渲染 =======================
  function showHome() {
    els.home.style.display = 'flex';
    els.header.style.display = 'none';
    els.results.style.display = 'none';
    els.notice.style.display = 'none';
    els.homeInput.value = '';
    els.topInput.value = '';
    state.renderSeq++;  // 丢弃进行中的请求结果
    document.title = 'GitHub 搜索';
  }

  function showResultsShell() {
    els.home.style.display = 'none';
    els.header.style.display = 'block';
    els.notice.style.display = 'none';
    els.results.style.display = 'block';
  }

  function skeletons(n) {
    let html = '<div class="meta">正在搜索…</div>';
    for (let i = 0; i < n; i++) {
      html += `<div class="skeleton">
        <div class="sk-line" style="width:42%;height:16px"></div>
        <div class="sk-line" style="width:22%"></div>
        <div class="sk-line" style="width:88%"></div>
        <div class="sk-line" style="width:64%"></div>
      </div>`;
    }
    return html;
  }

  const ICON = {
    star: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>',
    fork: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.75.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm-3 8.75a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/></svg>',
    issue: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"/></svg>',
    clock: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm7-3.25v2.992l2.028.812a.75.75 0 0 1-.557 1.392l-2.5-1A.75.75 0 0 1 7 8.25v-3.5a.75.75 0 0 1 1.5 0Z"/></svg>',
    tag: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M1 7.775V2.75C1 1.784 1.784 1 2.75 1h5.025c.464 0 .91.184 1.238.513l6.25 6.25a1.75 1.75 0 0 1 0 2.474l-5.026 5.026a1.75 1.75 0 0 1-2.474 0l-6.25-6.25A1.75 1.75 0 0 1 1 7.775Zm1.5 0c0 .066.026.13.073.177l6.25 6.25a.25.25 0 0 0 .354 0l5.025-5.025a.25.25 0 0 0 0-.354l-6.25-6.25a.25.25 0 0 0-.177-.073H2.75a.25.25 0 0 0-.25.25ZM6 5a1 1 0 1 1 0 2 1 1 0 0 1 0-2Z"/></svg>',
  };

  function repoCard(r) {
    const full = `${r.owner?.login || ''}/${r.name}`;
    const desc = r.description
      ? `<div class="desc">${esc(r.description)}</div>`
      : `<div class="desc empty">作者没有填写项目描述</div>`;
    const topics = (r.topics || []).slice(0, 8)
      .map((t) => `<a class="tag" href="#q=${encodeURIComponent('topic:' + t)}">${esc(t)}</a>`).join('');
    const lang = r.language
      ? `<span class="item"><i class="dot-lang" style="background:${langColor(r.language)}"></i>${esc(r.language)}</span>`
      : '';
    return `<div class="card" data-repo="${esc(full)}">
      <a class="full" href="${esc(r.html_url)}" target="_blank" rel="noopener">
        <span class="owner">${esc(r.owner?.login || '')} /</span> ${esc(r.name)}
      </a>
      ${r.archived ? '<span class="sub" style="color:#9195a3">已归档</span>' : ''}
      ${r.fork ? '<span class="sub" style="color:#8250df">Fork</span>' : ''}
      <div class="sub">${esc(r.full_name)}</div>
      ${desc}
      <div class="release" data-state="idle">
        <div class="rel-head"></div>
        <div class="rel-body"></div>
      </div>
      <div class="readme" data-state="idle">
        <div class="rd-label">README 摘要</div>
        <div class="rd-body"></div>
      </div>
      ${topics ? `<div class="tags">${topics}</div>` : ''}
      <div class="stats">
        ${lang}
        <span class="item st-star">${ICON.star}${fmtNum(r.stargazers_count)}</span>
        <span class="item st-fork">${ICON.fork}${fmtNum(r.forks_count)}</span>
        <span class="item st-issue">${ICON.issue}${fmtNum(r.open_issues_count)}</span>
        <span class="item" title="更新于 ${esc(fmtDateFull(r.pushed_at))}">${ICON.clock}${esc(fmtDate(r.pushed_at))}更新</span>
      </div>
    </div>`;
  }

  function userCard(u) {
    return `<div class="card">
      <a class="full" href="${esc(u.html_url)}" target="_blank" rel="noopener">
        <span class="owner">@</span>${esc(u.login)}
      </a>
      <div class="sub">${esc(u.type)}</div>
      <div class="stats"><span class="item">${esc(u.html_url)}</span></div>
    </div>`;
  }

  function renderMeta(total, page, item) {
    const maxPage = Math.min(Math.ceil(total / PER_PAGE), Math.floor(1000 / PER_PAGE));
    const clock = (item && item.searchMs) ? `${(item.searchMs / 1000).toFixed(2)} 秒` : '';
    return `<div class="meta">
      <span>找到约 <b>${total.toLocaleString('zh-CN')}</b> 个结果</span>
      ${clock ? `<span class="dot">·</span><span>用时 ${clock}</span>` : ''}
      ${total > PER_PAGE ? `<span class="dot">·</span><span>第 ${page} / ${maxPage} 页</span>` : ''}
      <span class="dot">·</span><span>数据来自 GitHub 实时接口</span>
    </div>`;
  }

  function pagerHtml(total, page) {
    const pages = Math.ceil(total / PER_PAGE);
    const maxPage = Math.min(pages, Math.floor(1000 / PER_PAGE));
    if (maxPage <= 1) return '';
    const btn = (p, label, cls = '', dis = false) =>
      `<button data-page="${p}" class="${cls}" ${dis ? 'disabled' : ''}>${label}</button>`;

    let out = btn(page - 1, '‹ 上一页', '', page <= 1);
    const set = new Set([1, maxPage]);
    for (let i = page - 2; i <= page + 2; i++) if (i > 1 && i < maxPage) set.add(i);
    const arr = [...set].sort((a, b) => a - b);
    let prev = 0;
    for (const p of arr) {
      if (p - prev > 1) out += '<span class="gap">…</span>';
      out += btn(p, p, p === page ? 'on' : '');
      prev = p;
    }
    out += btn(page + 1, '下一页 ›', '', page >= maxPage);
    return `<div class="pager">${out}</div>`;
  }

  // ======================= README 懒加载 =======================
  // ======================= Release 渲染 =======================
  async function loadRelease(box, fullName) {
    if (!box || box.dataset.state === 'loading' || box.dataset.state === 'done') return;
    box.dataset.state = 'loading';
    box.querySelector('.rel-head').innerHTML = `<span class="rel-tag">${ICON.tag}读取最新版本…</span>`;
    box.classList.add('show');
    const out = await fetchLatestRelease(fullName);
    box.dataset.state = 'done';
    const head = box.querySelector('.rel-head');
    const body = box.querySelector('.rel-body');

    if (out.none) {
      // 没有 release 的项目不占版面
      box.classList.remove('show');
      box.dataset.state = 'empty';
      return;
    }
    if (out.error) {
      box.classList.remove('show');
      box.dataset.state = 'empty';
      return;
    }

    const badges = [];
    if (out.pre) badges.push('<span class="rel-badge pre">预发布</span>');
    if (out.draft) badges.push('<span class="rel-badge pre">草稿</span>');
    if (out.assets) badges.push(`<span class="rel-date">${out.assets} 个附件</span>`);

    head.innerHTML = `<a class="rel-tag" href="${esc(out.url)}" target="_blank" rel="noopener">${ICON.tag}${esc(out.tag)}</a>
      ${out.name && out.name !== out.tag ? `<span class="rel-date">${esc(out.name)}</span>` : ''}
      ${out.published ? `<span class="rel-date">发布于 ${esc(fmtDate(out.published))}</span>` : ''}
      ${badges.join('')}`;
    body.textContent = out.body || '';
    if (!out.body) {
      body.innerHTML = '<span class="rel-empty">该版本没有写更新说明</span>';
      return;
    }
    // 更新说明同样先显示原文，译好后替换为中文
    if (needsTranslation(out.body)) {
      box.classList.add('translating');
      const cn = await translateText(out.body);
      box.classList.remove('translating');
      if (cn) paintBilingual(box, out.body, cn, 'release');
    }
  }

  // 点击 release 区域：展开完整更新说明
  function toggleRelease(e) {
    if (e.target.closest('.lang-toggle')) return;
    const box = e.target.closest('.release');
    if (!box || e.target.closest('a')) return;
    if (box.dataset.state !== 'done') return;
    box.classList.toggle('open');
  }

  // ======================= 本地翻译（Chrome 内置 Translator API） =======================
  // 纯前端无法自带翻译模型，用浏览器设备端翻译：不联网、不限流、原文不出本机。
  let translatorPromise = null;
  let translatorUnavailable = false;

  const hasTranslatorApi = () =>
    typeof window !== 'undefined' && 'Translator' in window && typeof window.Translator.create === 'function';

  // 判断文本是否需要翻译：中文字符占比低的英文内容才翻，避免把本就中文的摘要再折腾一遍
  function needsTranslation(text) {
    const s = String(text || '');
    if (s.length < 8) return false;
    const cjk = (s.match(/[\u4e00-\u9fff]/g) || []).length;
    const letters = (s.match(/[A-Za-z]/g) || []).length;
    if (cjk === 0) return letters >= 8;
    // 中文为主（字符数超过英文单词级别）就不翻
    return cjk < letters * 0.6;
  }

  async function getTranslator() {
    if (translatorUnavailable || !hasTranslatorApi()) return null;
    if (translatorPromise) return translatorPromise;
    translatorPromise = (async () => {
      try {
        const availability = await window.Translator.availability({
          sourceLanguage: 'en',
          targetLanguage: 'zh',
        });
        if (availability === 'unavailable') {
          translatorUnavailable = true;
          return null;
        }
        const t = await window.Translator.create({
          sourceLanguage: 'en',
          targetLanguage: 'zh',
          monitor(m) {
            m.addEventListener('downloadprogress', (ev) => {
              if (ev.total) updateTranslateStatus(`正在下载翻译模型 ${Math.round((ev.loaded / ev.total) * 100)}%`);
            });
          },
        });
        updateTranslateStatus('');
        return t;
      } catch (_) {
        translatorUnavailable = true;
        return null;
      }
    })();
    return translatorPromise;
  }

  function updateTranslateStatus(msg) {
    const el = document.getElementById('transStatus');
    if (el) el.textContent = msg;
  }

  // 内存 + localStorage 缓存：同一个摘要在翻页、重搜、下次打开时都不再重译
  const TRANS_KEY = 'gh_trans_cache_v1';
  let transStore = null;

  function readTransStore() {
    if (transStore) return transStore;
    try {
      transStore = JSON.parse(localStorage.getItem(TRANS_KEY) || '{}');
    } catch (_) {
      transStore = {};
    }
    return transStore;
  }

  function writeTransStore() {
    if (!transStore) return;
    try {
      localStorage.setItem(TRANS_KEY, JSON.stringify(transStore));
    } catch (_) {
      // 配额满时清空重来，只保留本次会话内存里的结果
      const keys = Object.keys(transStore);
      if (keys.length > 20) {
        transStore = {};
        try { localStorage.removeItem(TRANS_KEY); } catch (__) {}
      }
    }
  }

  async function translateText(text) {
    const src = String(text || '').trim();
    if (!src || !needsTranslation(src)) return null;
    const store = readTransStore();
    if (store[src]) return store[src];

    const t = await getTranslator();
    if (!t) return null;
    try {
      const out = (await t.translate(src)).trim();
      if (!out || out === src) return null;
      store[src] = out;
      writeTransStore();
      return out;
    } catch (_) {
      return null;
    }
  }

  // 给摘要区填充原文 + 中文，并挂上切换按钮
  function paintBilingual(box, original, cn, kind) {
    const body = box.querySelector(kind === 'release' ? '.rel-body' : '.rd-body');
    if (!body) return;
    if (kind === 'release') {
      body.innerHTML = `<span class="bi-zh">${esc(cn[0]).toUpperCase()}${esc(cn.slice(1))}</span>`
        + `<span class="bi-en">${esc(original)}</span>`;
    } else {
      const showEllipsis = original.length >= 300 ? '…' : '';
      body.innerHTML = `<span class="bi-zh">${esc(cn)}</span>`
        + `<span class="bi-en">${esc(original + showEllipsis)}</span>`;
    }
    box.dataset.lang = 'zh';
    let btn = box.querySelector('.lang-toggle');
    if (!btn) {
      btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lang-toggle';
      box.appendChild(btn);
      // 「原文」按钮不能触发摘要的展开/收起
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        toggleLang(box);
      });
    }
    btn.textContent = '原文';
  }

  function toggleLang(box) {
    if (!box.dataset.lang) return;
    const toZh = box.dataset.lang === 'en';
    box.dataset.lang = toZh ? 'zh' : 'en';
    box.classList.toggle('show-en', !toZh);
    const btn = box.querySelector('.lang-toggle');
    if (btn) btn.textContent = toZh ? '原文' : '中文';
  }

  async function loadReadme(box, fullName) {
    if (!box || box.dataset.state === 'loading' || box.dataset.state === 'done') return;
    box.dataset.state = 'loading';
    box.querySelector('.rd-body').textContent = '加载中…';
    box.classList.add('show');
    const out = await fetchReadme(fullName);
    box.dataset.state = 'done';
    const body = box.querySelector('.rd-body');
    if (out.error !== undefined) {
      body.innerHTML = out.error
        ? `<span class="rd-err">${esc(out.error)}</span>`
        : '<span class="rd-err">该项目没有 README</span>';
      return;
    }
    if (!out.text) {
      body.innerHTML = '<span class="rd-err">README 内容较少，无法提取摘要</span>';
      return;
    }
    const original = out.text + (out.text.length >= 300 ? '…' : '');
    body.textContent = original;
    // 先出原文，中文译好后替换，避免用户盯着空白等
    if (needsTranslation(out.text)) {
      box.classList.add('translating');
      const cn = await translateText(out.text);
      box.classList.remove('translating');
      if (cn) paintBilingual(box, original, cn);
    }
  }

  // 点击已加载的摘要区，在「两行截断」和「完整摘要」之间切换
  function toggleReadme(e) {
    if (e.target.closest('.lang-toggle')) return;
    const box = e.target.closest('.readme');
    if (!box || !box.classList.contains('show') || e.target.closest('a')) return;
    if (box.dataset.state !== 'done') return;
    box.classList.toggle('open');
  }

  // 观察可见的卡片，滚动到视口附近再取 README / Release，避免一次性打满接口
  let io = null;
  function observeCards() {
    if (io) io.disconnect();
    if (!('IntersectionObserver' in window)) return;
    io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (!e.isIntersecting) continue;
        const card = e.target;
        const name = card.dataset.repo;
        const box = card.querySelector('.readme');
        if (box && box.dataset.state === 'auto') loadReadme(box, name);
        const rel = card.querySelector('.release');
        if (rel && rel.dataset.state === 'auto') loadRelease(rel, name);
        io.unobserve(card);
      }
    }, { rootMargin: '200px' });
    els.results.querySelectorAll('.card[data-repo]').forEach((c) => io.observe(c));
  }

  // ======================= 搜索主流程 =======================
  async function doSearch({ push = true } = {}) {
    const q = (state.q || '').trim();
    if (!q) { showHome(); return; }

    showResultsShell();
    els.results.innerHTML = skeletons(PER_PAGE);
    els.sortWrap.style.display = state.tab === 'repos' ? 'flex' : 'none';
    [...els.tabs.children].forEach((t) => t.classList.toggle('on', t.dataset.tab === state.tab));
    els.homeInput.value = q;
    els.topInput.value = q;
    els.sortSel.value = state.sort;
    document.title = `${q} - GitHub 搜索`;

    if (push) syncUrl(true);
    window.scrollTo({ top: 0, behavior: 'smooth' });

    const seq = ++state.renderSeq;
    const t0 = performance.now();
    try {
      if (state.tab === 'repos') {
        const data = await searchRepos(q, state.page, state.sort);
        if (seq !== state.renderSeq) return;
        const ms = performance.now() - t0;
        state.total = data.total_count || 0;
        const items = data.items || [];
        if (!items.length) {
          renderEmpty(q);
          return;
        }
        els.results.innerHTML =
          renderMeta(state.total, state.page, { searchMs: ms }) +
          items.map(repoCard).join('') +
          pagerHtml(state.total, state.page);
        // 首屏直接加载前 3 条，其余滚动到时再加载
        els.results.querySelectorAll('.card[data-repo]').forEach((c, i) => {
          const box = c.querySelector('.readme');
          const rel = c.querySelector('.release');
          if (i < 3) {
            loadReadme(box, c.dataset.repo);
            loadRelease(rel, c.dataset.repo);
          } else {
            box.dataset.state = 'auto';
            rel.dataset.state = 'auto';
          }
        });
        observeCards();
      } else {
        const data = await searchUsers(q, state.page);
        if (seq !== state.renderSeq) return;
        const ms = performance.now() - t0;
        state.total = data.total_count || 0;
        const items = data.items || [];
        if (!items.length) { renderEmpty(q); return; }
        els.results.innerHTML =
          renderMeta(state.total, state.page, { searchMs: ms }) +
          items.map(userCard).join('') +
          pagerHtml(state.total, state.page);
      }
    } catch (err) {
      if (seq !== state.renderSeq) return;
      renderError(err, q);
    }
  }

  function renderEmpty(q) {
    els.results.style.display = 'none';
    els.notice.style.display = 'block';
    els.notice.innerHTML = `<div class="title">没有找到「${esc(q)}」相关的项目</div>
      <div class="body">
        换个关键词试试，或者用 GitHub 的搜索语法，例如：<br>
        <code>language:Python stars:&gt;1000</code>、<code>topic:llm</code>、
        <code>pushed:&gt;2024-01-01</code>、<code>in:readme 爬虫</code>
      </div>
      <div class="acts">
        <button onclick="history.length>1?history.back():location.hash=''">返回</button>
        <button onclick="location.hash='q=stars:>10000'">看看最热门的项目</button>
      </div>`;
  }

  function renderError(err, q) {
    els.results.style.display = 'none';
    els.notice.style.display = 'block';
    const isRate = err.kind === 'rate';
    const isAuth = err.kind === 'auth';
    const isNet = err.kind === 'network';
    let title = '搜索出错了';
    let body = esc(err.message || '未知错误');
    if (isRate) {
      title = '触发 GitHub 接口限流';
      body = `未认证请求每分钟只能搜索约 10 次，稍等一会儿再试，或配置一个 Personal Access Token 大幅提升额度。
        ${getToken() ? '当前已配置 Token，若仍限流说明额度也用完了。' : ''}`;
    } else if (isAuth) {
      title = 'Token 失效';
      body = '当前保存的 Token 无效或已过期，请重新配置或清除。';
    } else if (isNet) {
      title = '网络不可达';
      body = '无法连接 api.github.com，检查网络或代理后重试。';
    }
    els.notice.innerHTML = `<div class="title">${esc(title)}</div>
      <div class="body">${body}</div>
      <div class="acts">
        <button id="retryBtn">重试</button>
        <button id="errSettings">配置 Token</button>
        <button onclick="location.hash=''">回到首页</button>
      </div>`;
    $('retryBtn').onclick = () => doSearch({ push: false });
    $('errSettings').onclick = openSettings;
  }

  // ======================= URL 同步 =======================
  function syncUrl(replace) {
    const p = new URLSearchParams();
    if (state.q) p.set('q', state.q);
    if (state.tab !== 'repos') p.set('tab', state.tab);
    if (state.sort) p.set('sort', state.sort);
    if (state.page > 1) p.set('page', String(state.page));
    const hash = '#' + p.toString();
    if (replace) history.replaceState(null, '', hash || '#');
    else history.pushState(null, '', hash || '#');
  }

  function readUrl() {
    const p = new URLSearchParams(location.hash.replace(/^#/, ''));
    state.q = p.get('q') || '';
    state.tab = p.get('tab') === 'users' ? 'users' : 'repos';
    state.sort = p.get('sort') || '';
    state.page = Math.max(1, parseInt(p.get('page') || '1', 10) || 1);
    return !!state.q;
  }

  function navigate(patch, { push = true } = {}) {
    Object.assign(state, patch);
    // sort 只在仓库 tab 生效
    if (state.tab !== 'repos') state.sort = '';
    return doSearch({ push });
  }

  // ======================= 事件绑定 =======================
  function runSearchFromInput(input, resetPage = true) {
    const q = input.value.trim();
    if (!q) { input.focus(); return; }
    if (resetPage) state.page = 1;
    navigate({ q });
  }

  $('homeForm').addEventListener('submit', (e) => { e.preventDefault(); runSearchFromInput(els.homeInput); });
  $('topForm').addEventListener('submit', (e) => { e.preventDefault(); runSearchFromInput(els.topInput); });
  $('toHome').addEventListener('click', () => { location.hash = ''; });

  $('chips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip');
    if (!b) return;
    els.homeInput.value = b.dataset.q;
    state.page = 1;
    navigate({ q: b.dataset.q, tab: 'repos' });
  });

  els.tabs.addEventListener('click', (e) => {
    const t = e.target.closest('.tab');
    if (!t || t.dataset.tab === state.tab) return;
    navigate({ tab: t.dataset.tab, page: 1 });
  });

  els.sortSel.addEventListener('change', () => {
    navigate({ sort: els.sortSel.value, page: 1 });
  });

  els.results.addEventListener('click', (e) => {
    const rel = e.target.closest('.release');
    if (rel) {
      const card = rel.closest('.card');
      if (rel.dataset.state === 'idle' || rel.dataset.state === 'auto') {
        if (card && card.dataset.repo) loadRelease(rel, card.dataset.repo);
      } else {
        toggleRelease(e);
      }
      return;
    }
    const more = e.target.closest('.readme');
    if (more) {
      // 未加载的摘要区点击后加载，已加载的由 toggleReadme 展开/收起
      const card = more.closest('.card');
      if (more.dataset.state === 'idle' || more.dataset.state === 'auto') {
        loadReadme(more, card.dataset.repo);
      } else {
        toggleReadme(e);
      }
      return;
    }
    const pg = e.target.closest('button[data-page]');
    if (pg && !pg.disabled) {
      const p = +pg.dataset.page;
      if (p >= 1) navigate({ page: p });
      return;
    }
    const tag = e.target.closest('.tag');
    if (tag) {
      e.preventDefault();
      state.page = 1;
      navigate({ q: decodeURIComponent(tag.getAttribute('href').slice(3)), tab: 'repos' });
    }
  });

  window.addEventListener('hashchange', () => {
    if (readUrl()) doSearch({ push: false });
    else showHome();
  });

  // 设置面板
  function openSettings() {
    $('tokenInput').value = getToken();
    let hint = '当前未配置 Token，匿名额度约每分钟 10 次搜索。';
    try {
      const r = JSON.parse(sessionStorage.getItem('gh_rate') || 'null');
      if (r && r.reset) {
        const left = Math.max(0, Math.ceil((r.reset * 1000 - Date.now()) / 60000));
        hint += `最近一次请求剩余额度 ${r.remain}，${left} 分钟后重置。`;
      }
    } catch (_) {}
    if (getToken()) hint = (hint.startsWith('当前未配置') ? '' : '') + '已配置 Token，额度限制为每分钟 30 次搜索。';
    $('rateHint').textContent = hint;
    $('sheetMask').classList.add('open');
    setTimeout(() => $('tokenInput').focus(), 40);
  }
  function closeSettings() { $('sheetMask').classList.remove('open'); }

  $('openSettings').onclick = openSettings;
  $('openSettings2').onclick = openSettings;
  $('sheetMask').addEventListener('click', (e) => { if (e.target === $('sheetMask')) closeSettings(); });
  $('saveToken').onclick = () => {
    const t = $('tokenInput').value.trim();
    if (t) localStorage.setItem(TOKEN_KEY, t);
    else localStorage.removeItem(TOKEN_KEY);
    closeSettings();
    if (state.q) doSearch({ push: false });
  };
  $('clearToken').onclick = () => {
    localStorage.removeItem(TOKEN_KEY);
    $('tokenInput').value = '';
    $('rateHint').textContent = '已清除 Token，恢复匿名额度（约每分钟 10 次）。';
  };

  // 快捷键：/ 聚焦搜索、Esc 关面板
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeSettings();
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      (els.header.style.display === 'block' ? els.topInput : els.homeInput).focus();
    }
  });

  // ======================= 启动 =======================
  if (readUrl()) doSearch({ push: false });
  else { showHome(); els.homeInput.focus(); }
})();
</script>
</body>
</html>
